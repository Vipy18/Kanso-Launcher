name: Build Debug APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'kanso-launcher-*.apk'
  pull_request:
  workflow_dispatch:

concurrency:
  group: root-apk-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure pre-installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${SDK_DIR}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ${SDK_DIR}/cmdline-tools"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          PACKAGES=()
          if [ ! -d "${SDK_DIR}/platforms/android-36" ]; then
            PACKAGES+=("platforms;android-36")
          fi
          if [ ! -d "${SDK_DIR}/build-tools/36.0.0" ]; then
            PACKAGES+=("build-tools;36.0.0")
          fi
          if [ ! -d "${SDK_DIR}/platform-tools" ]; then
            PACKAGES+=("platform-tools")
          fi

          if [ ${#PACKAGES[@]} -gt 0 ]; then
            echo "Installing Android SDK packages: ${PACKAGES[*]}"
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "${PACKAGES[@]}"
          else
            echo "Required Android SDK packages already installed."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Prepare debug signing keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${RUNNER_TEMP}/debug-ci.keystore"
            echo "USE_SECRET_DEBUG_KS=true" >> "$GITHUB_ENV"
          else
            echo "USE_SECRET_DEBUG_KS=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Finalize and sign Debug APK
        shell: bash
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT_APK="kanso-launcher-debug.apk"
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)

          if [ "${USE_SECRET_DEBUG_KS:-false}" = "true" ]; then
            export KS_PASS="${DEBUG_KEYSTORE_PASSWORD:-android}"
            export KEY_PASS="${DEBUG_KEY_PASSWORD:-$KS_PASS}"
            KEY_ALIAS="${DEBUG_KEY_ALIAS:-androiddebugkey}"

            cp "$SRC_APK" "${RUNNER_TEMP}/unsigned-debug.apk"
            zip -d "${RUNNER_TEMP}/unsigned-debug.apk" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/MANIFEST.MF" >/dev/null 2>&1 || true
            "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "${RUNNER_TEMP}/unsigned-debug.apk" "${RUNNER_TEMP}/aligned-debug.apk"
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks "${RUNNER_TEMP}/debug-ci.keystore" \
              --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "$OUT_APK" \
              "${RUNNER_TEMP}/aligned-debug.apk"
          else
            cp "$SRC_APK" "$OUT_APK"
          fi

          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "$OUT_APK"
          ls -lh "$OUT_APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kanso-launcher-debug-apk
          path: kanso-launcher-debug.apk
          retention-days: 30

      - name: Commit Debug APK to repository root
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/debug.keystore"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kanso-launcher-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update kanso-launcher-debug.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to kanso-launcher-debug.apk"
          fi

      - name: Scrub temporary keystores
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/debug-ci.keystore" \
                "${RUNNER_TEMP}/unsigned-debug.apk" \
                "${RUNNER_TEMP}/aligned-debug.apk" \
                "${GITHUB_WORKSPACE}/debug.keystore"
