name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: root-apk-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate required Release Secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=()
          [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] && MISSING+=("RELEASE_KEYSTORE_BASE64")
          [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ] && MISSING+=("RELEASE_KEYSTORE_PASSWORD")
          [ -z "${RELEASE_KEY_ALIAS:-}" ] && MISSING+=("RELEASE_KEY_ALIAS")
          [ -z "${RELEASE_KEY_PASSWORD:-}" ] && MISSING+=("RELEASE_KEY_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Release Secrets: ${MISSING[*]}"
            echo "Add all four secrets under Repository Settings -> Secrets and variables -> Actions before running Release builds."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Release keystore and prepare Gradle runner
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Release APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease
          else
            gradle :app:assembleRelease
          fi

      - name: Align, sign, and verify Release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_APK="kanso-launcher-release.apk"
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)

          cp "$SRC_APK" "${RUNNER_TEMP}/unsigned-release.apk"
          zip -d "${RUNNER_TEMP}/unsigned-release.apk" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/MANIFEST.MF" >/dev/null 2>&1 || true
          "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "${RUNNER_TEMP}/unsigned-release.apk" "${RUNNER_TEMP}/aligned-release.apk"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$OUT_APK" \
            "${RUNNER_TEMP}/aligned-release.apk"

          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "$OUT_APK"
          ls -lh "$OUT_APK"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanso-launcher-release-apk
          path: kanso-launcher-release.apk
          retention-days: 90

      - name: Commit Release APK to repository root
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${GITHUB_WORKSPACE}/debug.keystore"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kanso-launcher-release.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update kanso-launcher-release.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to kanso-launcher-release.apk"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kanso-launcher-release.apk
          generate_release_notes: true

      - name: Scrub temporary keystores
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/release.keystore" \
                "${RUNNER_TEMP}/unsigned-release.apk" \
                "${RUNNER_TEMP}/aligned-release.apk" \
                "${GITHUB_WORKSPACE}/debug.keystore"
