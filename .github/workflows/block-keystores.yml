name: Block Keystore Files

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  block-keystores:
    name: block-keystores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and diff for keystores
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          PATTERN='\.(jks|keystore|p12|pfx|bks)$'

          TRACKED_MATCHES=$(git ls-files | grep -iE "$PATTERN" || true)

          DIFF_MATCHES=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            DIFF_MATCHES=$(git diff --name-only "$PR_BASE_SHA" HEAD 2>/dev/null | grep -iE "$PATTERN" || true)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_MATCHES=$(git diff --name-only "$PUSH_BEFORE_SHA" HEAD 2>/dev/null | grep -iE "$PATTERN" || true)
          fi

          ALL_MATCHES=$(printf "%s\n%s\n" "$TRACKED_MATCHES" "$DIFF_MATCHES" | sed '/^$/d' | sort -u || true)

          if [ -n "$ALL_MATCHES" ]; then
            echo "::error::Keystore or certificate files detected in repository or PR diff!"
            echo ""
            echo "Blocked files:"
            echo "$ALL_MATCHES"
            echo ""
            echo "Keystore files (*.jks, *.keystore, *.p12, *.pfx, *.bks) must NEVER be committed to Git,"
            echo "even if force-added past .gitignore. Remove them from Git history and supply signing"
            echo "keystores exclusively through GitHub Repository Secrets (DEBUG_KEYSTORE_BASE64 / RELEASE_KEYSTORE_BASE64)."
            exit 1
          fi

          echo "Keystore guardrail passed: no keystore or certificate files found."
